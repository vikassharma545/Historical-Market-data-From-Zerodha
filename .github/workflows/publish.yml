name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publishing
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Never publish a release whose tests fail.
      - name: Run tests
        run: |
          pip install -e ".[web,dev]"
          pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package
        # Pinned to a commit: a branch ref could change under us.
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0 (the commit, not the tag object)
        with:
          # Print the SHA-256 of each uploaded file so it can be checked against PyPI.
          print-hash: true
